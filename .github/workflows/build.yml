name: Build patched Sub2API image

# Build-only validation; production deployment is intentionally separate.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Official tag or commit; leave empty for latest release"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild even if this version already exists in GHCR"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-patched-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4

      - name: Resolve latest official release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          if [[ -n "$REQUESTED_REF" ]]; then
            echo "tag=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(./scripts/latest-release.sh)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare official source and conditional patch
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.tag }}
        run: ./scripts/prepare-source.sh "$UPSTREAM_REF" upstream-src

      - name: Read build information
        id: source
        run: |
          source upstream-src/.sub2api-patch-info
          echo "revision=$UPSTREAM_REVISION" >> "$GITHUB_OUTPUT"
          echo "patch_status=$PATCH_STATUS" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/sub2api-custom" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing candidate image
        id: candidate
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}-dotfix
        run: |
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream-src/backend/go.mod
          cache-dependency-path: upstream-src/backend/go.sum

      - name: Test backend validation and EasyPay forwarding
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        working-directory: upstream-src/backend
        run: |
          go test ./internal/service -run TestValidateEasyPayCustomMethods -count=1
          go test ./internal/payment/provider -run TestEasyPayCustomMethodsUseConfiguredUpstreamType -count=1

      - name: Set up Node.js
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test frontend EasyPay form
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        working-directory: upstream-src/frontend
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/components/payment/__tests__/PaymentProviderDialog.spec.ts

      - name: Set up QEMU
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Build and publish
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: upstream-src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}-dotfix
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}-dotfix
            COMMIT=${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}-dotfix
            io.sub2api.patch.status=${{ steps.source.outputs.patch_status }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Telegram
        if: ${{ always() && (steps.candidate.outputs.exists != 'true' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PATCH_STATUS: ${{ steps.source.outputs.patch_status }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CANDIDATE_EXISTS: ${{ steps.candidate.outputs.exists }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          if [[ "$CANDIDATE_EXISTS" == "true" ]]; then
            title="Sub2API 候选镜像已经存在"
            printf -v detail '版本: %s\n镜像: %s:%s-dotfix\n状态: 未重复构建，生产服务未变更' \
              "$RELEASE_TAG" "$IMAGE_NAME" "$RELEASE_TAG"
          elif [[ "$JOB_STATUS" == "success" ]]; then
            title="Sub2API 候选镜像已通过自检"
            printf -v detail '版本: %s\n补丁: %s\n镜像: %s:%s-dotfix\n状态: 已构建并推送，尚未部署' \
              "$RELEASE_TAG" "$PATCH_STATUS" "$IMAGE_NAME" "$RELEASE_TAG"
          else
            title="Sub2API 候选镜像构建失败"
            printf -v detail '版本: %s\n状态: %s\n生产服务未变更' \
              "${RELEASE_TAG:-未知}" "$JOB_STATUS"
          fi

          payload=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg title "$title" \
            --arg detail "$detail" \
            --arg run_url "$RUN_URL" \
            '{chat_id: $chat_id, text: ($title + "\n\n" + $detail), reply_markup: {inline_keyboard: [[{text: "查看构建结果", url: $run_url}]]}}')
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
