name: Deploy Sub2API candidate

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Candidate tag; latest means the newest candidate that passed checks"
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: sub2api-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate candidate tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: '[[ "$IMAGE_TAG" =~ ^(latest|v[0-9]+\.[0-9]+\.[0-9]+-dotfix)$ ]]'

      - name: Install deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install pinned server host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull, inspect, and cache candidate without restarting production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" sudo /usr/local/sbin/sub2api-release \
            prepare "${{ github.run_id }}" "ghcr.io/dmechai/sub2api-custom:${IMAGE_TAG}"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Install deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install pinned server host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Activate the prepared local image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" sudo /usr/local/sbin/sub2api-release \
            activate "${{ github.run_id }}"
