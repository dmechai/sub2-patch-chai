name: Build patched Sub2API image

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Official tag or commit; leave empty for latest release"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-patched-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4

      - name: Resolve latest official release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          if [[ -n "$REQUESTED_REF" ]]; then
            echo "tag=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(./scripts/latest-release.sh)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare official source and conditional patch
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.tag }}
        run: ./scripts/prepare-source.sh "$UPSTREAM_REF" upstream-src

      - name: Read build information
        id: source
        run: |
          source upstream-src/.sub2api-patch-info
          echo "revision=$UPSTREAM_REVISION" >> "$GITHUB_OUTPUT"
          echo "patch_status=$PATCH_STATUS" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/sub2api-custom" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: upstream-src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}-dotfix
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}-dotfix
            COMMIT=${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}-dotfix
            io.sub2api.patch.status=${{ steps.source.outputs.patch_status }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
