name: Build patched Sub2API image

# Build, validate, and automatically deploy new official releases.

on:
  push:
    branches:
      - main
    paths:
      - "patches/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Official tag or commit; leave empty for latest release"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild even if this version already exists in GHCR"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub schedules use UTC; 20:00 UTC is 04:00 Asia/Shanghai.
    - cron: "0 20 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-patched-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      image_name: ${{ steps.image.outputs.name }}
      patch_status: ${{ steps.source.outputs.patch_status }}
      release_summary: ${{ steps.release_notes.outputs.summary }}
    steps:
      - name: Check out patch repository
        id: checkout
        uses: actions/checkout@v4

      - name: Resolve latest official release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          if [[ -n "$REQUESTED_REF" ]]; then
            echo "tag=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(./scripts/latest-release.sh)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare official source and conditional patch
        id: prepare
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.tag }}
        run: ./scripts/prepare-source.sh "$UPSTREAM_REF" upstream-src

      - name: Read build information
        id: source
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          source upstream-src/.sub2api-patch-info
          echo "revision=$UPSTREAM_REVISION" >> "$GITHUB_OUTPUT"
          echo "patch_status=$PATCH_STATUS" >> "$GITHUB_OUTPUT"
          echo "version=${UPSTREAM_TAG#v}-dotfix" >> "$GITHUB_OUTPUT"

      - name: Read official release summary
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          summary=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/Wei-Shaw/sub2api/releases/tags/${RELEASE_TAG}" \
            | jq -r '.body // ""' \
            | sed 's/�//g' \
            | sed -E 's/\r//g; s/[[:space:]]+$//' \
            | awk '
              /^##[[:space:]]+新增功能/ { in_features=1; next }
              /^##[[:space:]]+/ { in_features=0; next }
              {
                line=$0
                gsub(/^>[[:space:]]*/, "", line)
                if (in_features && line ~ /^[-*][[:space:]]+/) {
                  sub(/^[-*][[:space:]]+/, "", line)
                  if (feature_count < 3 && line != "") features[++feature_count]=line
                  next
                }
                if (!in_features && intro_count < 2 && line != "") intro[++intro_count]=line
              }
              END {
                if (intro_count > 0) { print "概览: " intro[1] }
                if (intro_count > 1) { print "补充: " intro[2] }
                if (feature_count > 0) {
                  print "重点功能:"
                  for (i=1; i<=feature_count; i++) print "- " features[i]
                }
              }
            ' \
            || true)
          if [[ -z "$summary" ]]; then
            summary="官方 Release 详情请查看构建结果"
          fi
          {
            echo 'summary<<RELEASE_SUMMARY_EOF'
            echo "$summary"
            echo 'RELEASE_SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/sub2api-custom" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing candidate image
        id: candidate
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}-dotfix
        run: |
          if [[ "$FORCE_REBUILD" == "true" || "$EVENT_NAME" == "push" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream-src/backend/go.mod
          cache-dependency-path: upstream-src/backend/go.sum

      - name: Test backend validation and EasyPay forwarding
        id: backend_tests
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        working-directory: upstream-src/backend
        run: |
          go test ./internal/service -run TestValidateEasyPayCustomMethods -count=1
          go test ./internal/payment/provider -run TestEasyPayCustomMethodsUseConfiguredUpstreamType -count=1

      - name: Set up Node.js
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test frontend EasyPay form
        id: frontend_tests
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        working-directory: upstream-src/frontend
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            src/components/payment/__tests__/PaymentProviderDialog.spec.ts \
            src/components/payment/__tests__/PaymentMethodSelector.spec.ts

      - name: Set up QEMU
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Build and publish
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: upstream-src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}-dotfix
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            io.sub2api.patch.status=${{ steps.source.outputs.patch_status }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Telegram about build failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PATCH_STATUS: ${{ steps.source.outputs.patch_status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          BACKEND_TESTS_OUTCOME: ${{ steps.backend_tests.outcome }}
          FRONTEND_TESTS_OUTCOME: ${{ steps.frontend_tests.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROLLBACK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/rollback.yml
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          failure_reason="构建流程失败，请查看 Actions 日志"
          if [[ "$CHECKOUT_OUTCOME" == "failure" ]]; then
            failure_reason="补丁仓库检出失败"
          elif [[ "$RELEASE_OUTCOME" == "failure" ]]; then
            failure_reason="获取官方最新版本失败"
          elif [[ "$PREPARE_OUTCOME" == "failure" ]]; then
            failure_reason="补丁应用失败，可能与官方新版代码冲突"
          elif [[ "$BACKEND_TESTS_OUTCOME" == "failure" ]]; then
            failure_reason="后端补丁测试失败"
          elif [[ "$FRONTEND_TESTS_OUTCOME" == "failure" ]]; then
            failure_reason="前端补丁测试失败"
          elif [[ "$PUBLISH_OUTCOME" == "failure" ]]; then
            failure_reason="Docker 镜像构建或推送失败"
          fi
          printf -v detail '官方版本: %s\n构建结果: 失败\n原因: %s\n生产服务: 未变更\n补丁状态: %s\n运行记录: %s' \
            "${RELEASE_TAG:-未知}" "$failure_reason" "${PATCH_STATUS:-未确认}" "$RUN_URL"
          payload=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "Sub2API 更新失败\n\n$detail" \
            --arg rollback_url "$ROLLBACK_URL" \
            '{chat_id: $chat_id, text: $text, reply_markup: {inline_keyboard: [[{text: "回退 Sub2API", url: $rollback_url}]]}}')
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

  auto_deploy:
    name: Preflight and automatically deploy candidate
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: sub2api-production-deploy
      cancel-in-progress: false
    steps:
      - name: Install deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install pinned server host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Preflight candidate without restarting production
        id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.release_tag }}-dotfix
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT" && test -n "$DEPLOY_USER"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" sudo /usr/local/sbin/sub2api-release \
            prepare "${GITHUB_RUN_ID}" "$IMAGE_REF" | tee prepare-output.txt
          if grep -Fxq "already_active=true" prepare-output.txt; then
            echo "already_active=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Activate candidate and verify health
        id: activate
        if: ${{ success() && steps.preflight.outputs.already_active != 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" sudo /usr/local/sbin/sub2api-release \
            activate "${GITHUB_RUN_ID}"

      - name: Notify Telegram about deployment result
        if: ${{ always() && steps.preflight.outputs.already_active != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ACTIVATE_OUTCOME: ${{ steps.activate.outcome }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          PATCH_STATUS: ${{ needs.build.outputs.patch_status }}
          RELEASE_SUMMARY: ${{ needs.build.outputs.release_summary }}
          ROLLBACK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/rollback.yml
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          if [[ "$JOB_STATUS" == "success" ]]; then
            title="Sub2API 自动更新成功"
            result="自动部署完成，健康检查通过。"
          elif [[ "$ACTIVATE_OUTCOME" == "failure" ]]; then
            title="Sub2API 自动部署未成功"
            result="候选版本未完成健康切换；若切换后健康检查失败，服务器部署脚本会自动回滚。"
          elif [[ "$PREFLIGHT_OUTCOME" == "failure" ]]; then
            title="Sub2API 更新预检未通过"
            result="生产服务未切换，当前版本保持运行。"
          else
            title="Sub2API 自动更新失败"
            result="部署流程未完成，生产服务未确认切换；请查看运行记录。"
          fi
          printf -v detail '官方版本: %s\n\n官方更新内容:\n%s\n\n本地补丁: EasyPay upstreamType 支持点号（例如 usdt.trc20）；type=u 的 USDC/USDT 使用专属支付图标\n补丁状态: %s\n部署结果: %s\n运行记录: %s' \
            "$RELEASE_TAG" "${RELEASE_SUMMARY:-官方 Release 详情请查看运行记录}" \
            "${PATCH_STATUS:-未确认}" "$result" "$RUN_URL"
          payload=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg title "$title" \
            --arg detail "$detail" \
            --arg rollback_url "$ROLLBACK_URL" \
            '{chat_id: $chat_id, text: ($title + "\n\n" + $detail), reply_markup: {inline_keyboard: [[{text: "回退 Sub2API", url: $rollback_url}]]}}')
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
